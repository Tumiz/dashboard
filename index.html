<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold & Macro Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#f0f2f5;color:#1a1a2e;min-height:100vh
}
.header{
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  color:#fff;padding:16px 16px;box-shadow:0 2px 8px rgba(0,0,0,.15)
}
.header h1{font-size:18px;font-weight:600}
.header p{font-size:12px;color:#a8b2d1;margin-top:2px}
.container{max-width:1200px;margin:0 auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card .label{font-size:10px;color:#8b8fa3;margin-bottom:2px;text-transform:uppercase;letter-spacing:.3px}
.card .value{font-size:18px;font-weight:700;letter-spacing:-.3px}
.card .change{font-size:11px;margin-top:2px}
.card .change.up{color:#22c55e}
.card .change.down{color:#ef4444}
.card .sub{font-size:10px;color:#8b8fa3;margin-top:1px}
.chart-card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
.chart-card h2{font-size:12px;font-weight:600;margin-bottom:8px;color:#1a1a2e}
.chart-wrapper{position:relative;height:200px}
.table-card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.table-card h2{font-size:13px;font-weight:600;margin-bottom:8px;color:#1a1a2e}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:6px 6px;border-bottom:2px solid #e5e7eb;color:#6b7280;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
td{padding:6px 6px;border-bottom:1px solid #f3f4f6;white-space:nowrap}
td.up{color:#22c55e}
td.down{color:#ef4444}
.loading{text-align:center;padding:60px 0;color:#6b7280;font-size:14px}
.error{text-align:center;padding:60px 0;color:#ef4444;font-size:14px}
@media(min-width:640px){
  .header{padding:20px 24px}
  .header h1{font-size:22px}
  .header p{font-size:13px}
  .container{padding:20px}
  .stats{grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}

  .card{padding:16px}
  .card .label{font-size:11px}
  .card .value{font-size:22px}
  .chart-card{padding:20px;margin-bottom:20px}
  .chart-card h2{font-size:15px}
  .chart-wrapper{height:320px}
  .table-card{padding:20px}
  .table-card h2{font-size:15px}
  table{font-size:13px}
  th,td{padding:8px 10px}
}
@media(max-width:400px){
  .stats{grid-template-columns:1fr;gap:6px}
  .card{padding:10px}
  .card .value{font-size:16px}
  .chart-wrapper{height:180px}
  .chart-card{padding:10px}
  .table-card{padding:10px}
  th,td{padding:4px 4px;font-size:11px}
  th{font-size:9px}
  .header h1{font-size:16px}
  .header p{font-size:11px}
  .container{padding:8px}
}
</style>
</head>
<body>
<div class="header">
  <h1>Gold &middot; Macro Dashboard</h1>
  <p>Gold, BTC, AUX/USD, USD Index, CPI, Real Yield, GPR &amp; CB Demand</p>
</div>
<div class="container" id="app"><div class="loading">Loading...</div></div>

<script>
function parseCSV(text){
  const [header,...rows]=text.trim().split('\n').map(l=>l.split(','));
  return rows.map(r=>Object.fromEntries(header.map((h,i)=>[h.trim(),r[i].trim()])));
}

function fmt(n){return '¥'+Number(n).toFixed(2)}
function pct(n){return Number(n).toFixed(2)+'%'}
function chg(a,b){let d=((a-b)/b*100);return {val:d,cls:d>=0?'up':'down',sign:d>=0?'+':''}}

function render(gold, usd, cpi, real, gpr, btc, aux, cb){
  const glast=gold[gold.length-1], gprev=gold[gold.length-2];
  const gc=chg(+glast.close,+gprev.close);
  const gprices=gold.map(r=>+r.close);
  const gyc=chg(+glast.close,+gold[0].close);

  const ulast=usd[usd.length-1], uprev=usd[usd.length-2];
  const uc=chg(+ulast.close,+uprev.close);
  const clast=cpi[cpi.length-1], cprev=cpi[cpi.length-2];
  const cc=chg(+clast.cpi_yoy_pct,+cprev.cpi_yoy_pct);

  const rlast=real[real.length-1], rprev=real[real.length-2];
  const rc=chg(+rlast.real_yield_pct,+rprev.real_yield_pct);

  const gprLast=gpr[gpr.length-1], gprPrev=gpr[gpr.length-2];
  const gprc=chg(+gprLast.gpr,+gprPrev.gpr);

  const btcLast=btc[btc.length-1], btcPrev=btc[btc.length-2];
  const btcChg=chg(+btcLast.btc_usd,+btcPrev.btc_usd);

  const auxLast=aux[aux.length-1], auxPrev=aux[aux.length-2];
  const auxChg=chg(+auxLast.aux_usd,+auxPrev.aux_usd);

  const cbLast=cb[cb.length-1], cbPrev=cb[cb.length-2];
  const cbChg=chg(+cbLast.cb_demand,+cbPrev.cb_demand);

  const labels=gold.map(r=>r.month);
  const usdByMonth={}; usd.forEach(r=>usdByMonth[r.month]=r);
  const cpiByMonth={}; cpi.forEach(r=>cpiByMonth[r.date.substring(0,7)]=r);
  const realByMonth={}; real.forEach(r=>realByMonth[r.month]=r);
  const gprByMonth={}; gpr.forEach(r=>gprByMonth[r.month]=r);
  const btcByMonth={}; btc.forEach(r=>btcByMonth[r.month]=r);
  const auxByMonth={}; aux.forEach(r=>auxByMonth[r.month]=r);
  const cbByMonth={}; cb.forEach(r=>cbByMonth[r.month]=r);

  const usdOnLabels=labels.map(m=>usdByMonth[m]?+usdByMonth[m].close:null);
  const cpiOnLabels=labels.map(m=>cpiByMonth[m]?+cpiByMonth[m].cpi_yoy_pct:null);
  const realOnLabels=labels.map(m=>realByMonth[m]?+realByMonth[m].real_yield_pct:null);
  const gprOnLabels=labels.map(m=>gprByMonth[m]?+gprByMonth[m].gpr:null);
  const btcOnLabels=labels.map(m=>btcByMonth[m]?+btcByMonth[m].btc_usd:null);
  const auxOnLabels=labels.map(m=>auxByMonth[m]?+auxByMonth[m].aux_usd:null);
  const cbOnLabels=labels.map(m=>cbByMonth[m]?+cbByMonth[m].cb_demand:null);

  document.getElementById('app').innerHTML=`
    <div class="stats">
      <div class="card">
        <div class="label">Gold (¥/g)</div>
        <div class="value">${fmt(glast.close)}</div>
        <div class="change ${gc.cls}">${gc.sign}${gc.val.toFixed(2)}% MoM</div>
        <div class="sub">${glast.month}</div>
      </div>
      <div class="card">
        <div class="label">BTC/USD</div>
        <div class="value">$${Number(btcLast.btc_usd).toLocaleString()}</div>
        <div class="change ${btcChg.cls}">${btcChg.sign}${btcChg.val.toFixed(2)}% MoM</div>
        <div class="sub">${btcLast.month}</div>
      </div>
      <div class="card">
        <div class="label">AUX/USD</div>
        <div class="value">$${Number(auxLast.aux_usd).toFixed(2)}</div>
        <div class="change ${auxChg.cls}">${auxChg.sign}${auxChg.val.toFixed(2)}% MoM</div>
        <div class="sub">${auxLast.month}</div>
      </div>
      <div class="card">
        <div class="label">USD Index</div>
        <div class="value">${ulast.close}</div>
        <div class="change ${uc.cls}">${uc.sign}${uc.val.toFixed(2)}% MoM</div>
        <div class="sub">${ulast.month}</div>
      </div>
      <div class="card">
        <div class="label">US CPI YoY</div>
        <div class="value">${pct(clast.cpi_yoy_pct)}</div>
        <div class="change ${cc.cls}">${cc.sign}${cc.val.toFixed(2)}pp MoM</div>
        <div class="sub">${clast.date.substring(0,7)}</div>
      </div>
      <div class="card">
        <div class="label">Real 10Y Yield</div>
        <div class="value">${pct(rlast.real_yield_pct)}</div>
        <div class="change ${rc.cls}">${rc.sign}${rc.val.toFixed(2)}pp MoM</div>
        <div class="sub">${rlast.month}</div>
      </div>
      <div class="card">
        <div class="label">GPR</div>
        <div class="value">${Number(gprLast.gpr).toFixed(1)}</div>
        <div class="change ${gprc.cls}">${gprc.sign}${gprc.val.toFixed(1)}% MoM</div>
        <div class="sub">${gprLast.month}</div>
      </div>
      <div class="card">
        <div class="label">CB Demand (tonnes)</div>
        <div class="value">${Number(cbLast.cb_demand).toFixed(1)}</div>
        <div class="change ${cbChg.cls}">${cbChg.sign}${cbChg.val.toFixed(1)}% QoQ</div>
        <div class="sub">${cbLast.month}</div>
      </div>
    </div>

    <div class="chart-card">
      <h2>Gold, BTC, AUX/USD, USD Index, CPI, Real Yield, GPR &amp; CB Demand</h2>
      <div class="chart-wrapper"><canvas id="priceChart"></canvas></div>
    </div>

    <div class="table-card">
      <h2>Monthly Details</h2>
      <div class="wrap"><table>
        <thead><tr>
          <th>Month</th><th>Gold ¥/g</th><th>BTC/USD</th><th>AUX/USD</th><th>USD Idx</th><th>CPI YoY%</th><th>Real 10Y%</th><th>GPR</th><th>CB Dem (t)</th>
        </tr></thead>
        <tbody>${gold.map((r,i)=>{
          const bt=btcByMonth[r.month];
          const ax=auxByMonth[r.month];
          const u=usdByMonth[r.month];
          const c=cpiByMonth[r.month];
          const rel=realByMonth[r.month];
          const gp=gprByMonth[r.month];
          const cb=cbByMonth[r.month];
          return `<tr>
            <td><strong>${r.month}</strong></td>
            <td>${fmt(r.close)}</td>
            <td>${bt?'$'+Number(bt.btc_usd).toLocaleString():'-'}</td>
            <td>${ax?'$'+Number(ax.aux_usd).toFixed(2):'-'}</td>
            <td>${u?u.close:'-'}</td>
            <td>${c?pct(c.cpi_yoy_pct):'-'}</td>
            <td>${rel?pct(rel.real_yield_pct):'-'}</td>
            <td>${gp?Number(gp.gpr).toFixed(1):'-'}</td>
            <td>${cb?Number(cb.cb_demand).toFixed(1):'-'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>
  `;

  new Chart(document.getElementById('priceChart'),{
    type:'line',
    data:{
      labels,
      datasets:[{
        label:'Gold Close (¥/g)',
        data:gprices,
        borderColor:'#f59e0b',
        backgroundColor:'rgba(245,158,11,0.1)',
        fill:true,
        tension:.3,
        pointBackgroundColor:'#f59e0b',
        pointBorderColor:'#fff',
        pointBorderWidth:2,
        pointRadius:0,
        pointHoverRadius:0,
        pointHitRadius:0,
        yAxisID:'y'
      },{
        label:'USD Index',
        data:usdOnLabels,
        borderColor:'#0f3460',
        backgroundColor:'rgba(15,52,96,0.1)',
        fill:false,
        tension:.3,
        pointBackgroundColor:'#0f3460',
        pointBorderColor:'#fff',
        pointBorderWidth:1.5,
        pointRadius:0,
        pointHoverRadius:0,
        pointHitRadius:0,
        yAxisID:'y1'
      },{
        label:'GPR',
        data:gprOnLabels,
        borderColor:'#a855f7',
        backgroundColor:'rgba(168,85,247,0.1)',
        fill:false,
        tension:.3,
        pointBackgroundColor:'#a855f7',
        pointBorderColor:'#fff',
        pointBorderWidth:1.5,
        pointRadius:0,
        pointHoverRadius:0,
        pointHitRadius:0,
        yAxisID:'y3'
      },{
        label:'US CPI YoY (%)',
        data:cpiOnLabels,
        borderColor:'#ef4444',
        backgroundColor:'rgba(239,68,68,0.1)',
        fill:false,
        tension:.3,
        pointBackgroundColor:'#ef4444',
        pointBorderColor:'#fff',
        pointBorderWidth:1.5,
        pointRadius:0,
        pointHoverRadius:0,
        pointHitRadius:0,
        yAxisID:'y2'
      },{
        label:'BTC/USD',
        data:btcOnLabels,
        borderColor:'#f97316',
        backgroundColor:'rgba(249,115,22,0.1)',
        fill:false,
        tension:.3,
        pointBackgroundColor:'#f97316',
        pointBorderColor:'#fff',
        pointBorderWidth:1.5,
        pointRadius:0,
        pointHoverRadius:0,
        pointHitRadius:0,
        yAxisID:'y4'
      },{
        label:'AUX/USD',
        data:auxOnLabels,
        borderColor:'#06b6d4',
        backgroundColor:'rgba(6,182,212,0.1)',
        fill:false,
        tension:.3,
        pointBackgroundColor:'#06b6d4',
        pointBorderColor:'#fff',
        pointBorderWidth:1.5,
        pointRadius:0,
        pointHoverRadius:0,
        pointHitRadius:0,
        yAxisID:'y5'
      },{
        label:'Real 10Y Yield (%)',
        data:realOnLabels,
        borderColor:'#22c55e',
        backgroundColor:'rgba(34,197,94,0.1)',
        fill:false,
        tension:.3,
        pointBackgroundColor:'#22c55e',
        pointBorderColor:'#fff',
        pointBorderWidth:1.5,
        pointRadius:0,
        pointHoverRadius:0,
        pointHitRadius:0,
        yAxisID:'y2'
      },{
        label:'CB Demand (tonnes)',
        data:cbOnLabels,
        borderColor:'#ec4899',
        backgroundColor:'rgba(236,72,153,0.1)',
        fill:false,
        tension:.3,
        pointBackgroundColor:'#ec4899',
        pointBorderColor:'#fff',
        pointBorderWidth:1.5,
        pointRadius:0,
        pointHoverRadius:0,
        pointHitRadius:0,
        yAxisID:'y6'
      }]
    },
    plugins:[{
      id:'crosshair',
      afterDraw(chart){
        if(!chart._active.length) return;
        const ctx=chart.ctx;
        const x=chart._active[0].element.x;
        const top=chart.chartArea.top;
        const bot=chart.chartArea.bottom;
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([4,3]);
        ctx.strokeStyle='rgba(0,0,0,0.25)';
        ctx.lineWidth=1;
        ctx.moveTo(x,top);
        ctx.lineTo(x,bot);
        ctx.stroke();
        ctx.restore();
      }
    }],
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'top',labels:{boxWidth:window.innerWidth<640?10:16,boxHeight:window.innerWidth<640?8:12,font:{size:window.innerWidth<640?9:12},padding:window.innerWidth<640?6:10}},
        tooltip:{
          callbacks:{
            label:ctx=>{
              let v=ctx.parsed.y;
              if(ctx.dataset.yAxisID==='y') v='¥'+v.toFixed(2);
              else if(ctx.dataset.yAxisID==='y6') v=v.toFixed(1)+'t';
              else if(ctx.dataset.yAxisID==='y2') v=v.toFixed(2)+'%';
              else v=v.toFixed(1);
              return ctx.dataset.label+': '+v;
            }
          }
        }
      },
      scales:{
        x:{grid:{display:false},ticks:{maxTicksLimit:window.innerWidth<480?8:20,maxRotation:0}},
        y:{
          position:'left',title:{display:true,text:'Gold (¥/g)'},
          grid:{color:'rgba(0,0,0,0.06)'},
          ticks:{callback:v=>'¥'+v}
        },
        y1:{
          position:'right',title:{display:true,text:'USD Index'},
          grid:{display:false}
        },
        y2:{
          position:'right',title:{display:true,text:window.innerWidth<480?'CPI / Real Yld':'CPI & Real Yield (%)'},
          grid:{display:false},
          offset:true
        },
        y3:{
          position:'right',title:{display:true,text:'GPR'},
          grid:{display:false},
          offset:true
        },
        y4:{
          position:'right',title:{display:true,text:'BTC/USD'},
          grid:{display:false},
          offset:true
        },
        y5:{
          position:'right',title:{display:true,text:'AUX/USD'},
          grid:{display:false},
          offset:true
        },
        y6:{
          position:'right',title:{display:true,text:'CB Demand (t)'},
          grid:{display:false},
          offset:true
        }
      }
    }
  });
}

document.addEventListener('DOMContentLoaded',async ()=>{
  try{
    const [goldRes,usdRes,cpiRes,realRes,gprRes,btcRes,auxRes,cbRes]=await Promise.all([
      fetch('sge_gold_monthly.csv'),
      fetch('usd_index_monthly.csv'),
      fetch('us_cpi_monthly.csv'),
      fetch('us_real_yield_monthly.csv'),
      fetch('gpr_monthly.csv'),
      fetch('btc_monthly.csv'),
      fetch('aux_monthly.csv'),
      fetch('cb_demand_monthly.csv')
    ]);
    render(
      parseCSV(await goldRes.text()),
      parseCSV(await usdRes.text()),
      parseCSV(await cpiRes.text()),
      parseCSV(await realRes.text()),
      parseCSV(await gprRes.text()),
      parseCSV(await btcRes.text()),
      parseCSV(await auxRes.text()),
      parseCSV(await cbRes.text())
    );
  }catch(e){
    document.getElementById('app').innerHTML='<div class="error">Failed to load data: '+e.message+'</div>';
  }
});
</script>
</body>
</html>
