<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold & Macro & Stock Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="rolling_corr.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#f0f2f5;color:#1a1a2e;min-height:100vh
}
.header{
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  color:#fff;padding:16px 16px;box-shadow:0 2px 8px rgba(0,0,0,.15)
}
.header h1{font-size:18px;font-weight:600}
.header p{font-size:12px;color:#a8b2d1;margin-top:2px}
.container{max-width:1200px;margin:0 auto;padding:12px}
.chart-card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
.chart-card h2{font-size:12px;font-weight:600;margin-bottom:8px;color:#1a1a2e}
.chart-controls{position:relative;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chart-controls label{font-size:11px;color:#6b7280;font-weight:500;white-space:nowrap}
.chart-wrapper{position:relative;height:200px}
.range-group{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:nowrap}
.range-group label{font-size:10px;color:#6b7280;white-space:nowrap}
.range-group .range-label{font-size:10px;color:#374151;min-width:48px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dual-range{position:relative;width:80px;height:18px;flex-shrink:0}
.dual-range .dr-track{position:absolute;top:50%;left:0;right:0;height:4px;background:#e5e7eb;border-radius:2px;transform:translateY(-50%)}
.dual-range .dr-fill{position:absolute;top:50%;height:4px;background:#6366f1;border-radius:2px;transform:translateY(-50%)}
.dual-range input[type=range]{position:absolute;top:0;left:0;width:100%;height:100%;-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;margin:0;padding:0}
.dual-range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:#6366f1;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;pointer-events:auto}
.dual-range input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#6366f1;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;pointer-events:auto}
.table-card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.table-card h2{font-size:13px;font-weight:600;margin-bottom:8px;color:#1a1a2e}
.flow-legend{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:8px;font-size:11px;color:#6b7280}
.flow-legend .lg{display:flex;align-items:center;gap:5px;white-space:nowrap}
.flow-legend .lg-line{width:22px;height:3px;border-radius:2px}
.flow-legend .lg-node{width:12px;height:12px;border-radius:3px}
.flow-cap{font-size:11px;color:#9ca3af;margin-top:4px}
.flow-rationale{margin-top:10px;border:1px solid #e5e7eb;border-radius:8px;background:#fafafa}
.flow-rationale summary{cursor:pointer;font-size:12px;font-weight:600;color:#1a1a2e;padding:8px 12px;list-style:none}
.flow-rationale summary::-webkit-details-marker{display:none}
.flow-rationale summary::before{content:'▸ ';color:#6366f1;font-size:10px}
.flow-rationale[open] summary::before{content:'▾ '}
.flow-rationale .wrap{padding:0 12px 10px}
.flow-rationale td{white-space:normal;line-height:1.45;vertical-align:top}
.flow-rationale td.dir{white-space:nowrap;font-weight:600}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:6px 6px;border-bottom:2px solid #e5e7eb;color:#6b7280;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
td{padding:6px 6px;border-bottom:1px solid #f3f4f6;white-space:nowrap}
td.up{color:#22c55e}
td.down{color:#ef4444}
.loading{text-align:center;padding:60px 0;color:#6b7280;font-size:14px}
.error{text-align:center;padding:60px 0;color:#ef4444;font-size:14px}
@media(min-width:640px){
  .header{padding:20px 24px}
  .header h1{font-size:22px}
  .header p{font-size:13px}
  .container{padding:20px}
  .chart-card{padding:20px;margin-bottom:20px}
  .chart-card h2{font-size:15px}
  .chart-wrapper{height:320px}
  .dual-range{width:140px}
  .table-card{padding:20px}
  .table-card h2{font-size:15px}
  table{font-size:13px}
  th,td{padding:8px 10px}
}
@media(hover:none) and (pointer:coarse){
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,select{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
}
@media(max-width:480px){
  .chart-controls{flex-wrap:wrap;gap:4px}
  .chart-controls>label{display:none}
  .range-group{width:100%;margin-left:0}
  .range-group label{display:none}
  .range-group .range-label{font-size:9px;min-width:30px}
  .dual-range{flex:1;height:28px}
  .dual-range input[type=range]::-webkit-slider-thumb{width:20px;height:20px}
  .dual-range input[type=range]::-moz-range-thumb{width:20px;height:20px}
  #corrS1,#corrS2{max-width:none;flex:1;min-width:0}
}
@media(max-width:400px){
  .chart-wrapper{height:180px}
  .chart-card{padding:10px}
  .table-card{padding:10px}
  th,td{padding:4px 4px;font-size:11px}
  th{font-size:9px}
  .header h1{font-size:16px}
  .header p{font-size:11px}
  .container{padding:8px}
}
</style>
</head>
<body>
<div class="header">
  <h1>Gold &middot; Macro &middot; Stock Dashboard</h1>
</div>
<div class="container" id="app"><div class="loading">Loading...</div></div>

<script>
function parseCSV(text){
  const [header,...rows]=text.trim().split('\n').map(l=>l.split(','));
  return rows.map(r=>Object.fromEntries(header.map((h,i)=>[h.trim(),r[i].trim()])));
}

function fmt(n){return '¥'+Number(n).toFixed(2)}
function pct(n){return Number(n).toFixed(2)+'%'}

function render(rows){
  const num=v=>v===''||v==null?null:+v;
  const M={}; rows.forEach(r=>M[r.month]=r);
  const months=rows.map(r=>r.month);
  const goldMonths=months.filter(m=>M[m].gold_close!=='');
  const [fy,fm]=goldMonths[0].split('-').map(Number);
  const preLabels=[];
  for(let y=2000;y<=fy;y++){const endM=y===fy?fm-1:12;for(let m=1;m<=endM;m++)preLabels.push(y+'-'+String(m).padStart(2,'0'))}
  const labels=[...preLabels,...goldMonths];
  const gprices=[...new Array(preLabels.length).fill(null),...goldMonths.map(m=>num(M[m].gold_close))];
  const col=key=>labels.map(m=>{const r=M[m];return r&&r[key]!==''?num(r[key]):null});
  const usdOnLabels=col('usd_close');
  const cpiOnLabels=col('cpi_yoy_pct');
  const realOnLabels=col('real_yield_pct');
  const gprOnLabels=col('gpr');
  const btcOnLabels=col('btc_usd');
  const auxOnLabels=col('aux_usd');
  const xagOnLabels=col('xag_usd');
  const cbOnLabels=col('cb_demand');
  const fedOnLabels=col('fed_rate_pct');
  const nasdaqOnLabels=col('nasdaq_close');
  const au9999OnLabels=col('au9999_close');
  const usdCnyOnLabels=col('usd_cny');
  const tencentOnLabels=col('tencent_close');
  const cac40OnLabels=col('cac40_close');
  const daxOnLabels=col('dax_close');
  const sp500OnLabels=col('sp500_close');
  const nikkeiOnLabels=col('nikkei_close');
  const shanghaiOnLabels=col('shanghai_close');
  const kospiOnLabels=col('kospi_close');
  const auxXagOnLabels=labels.map((m,i)=>auxOnLabels[i]!=null&&xagOnLabels[i]!=null?auxOnLabels[i]/xagOnLabels[i]:null);
  const btcXauOnLabels=labels.map((m,i)=>btcOnLabels[i]!=null&&auxOnLabels[i]!=null?btcOnLabels[i]/auxOnLabels[i]:null);

  function r2(pairs){
    const n=pairs.length;
    if(n<4)return null;
    let sx=0,sy=0,sxy=0,sx2=0,sy2=0;
    for(const [x,y] of pairs){sx+=x;sy+=y;sxy+=x*y;sx2+=x*x;sy2+=y*y}
    return (n*sxy-sx*sy)/Math.sqrt((n*sx2-sx*sx)*(n*sy2-sy*sy));
  }

  function rLabel(r){
    const a=Math.abs(r);
    return a>=0.7?'Strong':a>=0.4?'Moderate':a>=0.2?'Weak':'None';
  }

  function bestLagCorr(map,key){
    const svals=labels.map(m=>{const o=map[m];return o&&o[key]!==''?+o[key]:null});
    let bestR=0,bestLag=0;
    for(let lag=-12;lag<=12;lag++){
      const pairs=[];
      for(let i=0;i<labels.length;i++){
        const j=i-lag;
        if(j>=0&&j<labels.length&&gprices[i]!=null&&svals[j]!=null)
          pairs.push([gprices[i],svals[j]]);
      }
      if(pairs.length>=4){
        const r=r2(pairs);
        if(r!==null&&Math.abs(r)>Math.abs(bestR)){bestR=r;bestLag=lag}
      }
    }
    return {r:bestR,lag:bestLag};
  }

  const auxXagByMonth={}; labels.forEach((m,i)=>{if(auxXagOnLabels[i]!=null)auxXagByMonth[m]={v:auxXagOnLabels[i]}});
  const btcXauByMonth={}; labels.forEach((m,i)=>{if(btcXauOnLabels[i]!=null)btcXauByMonth[m]={v:btcXauOnLabels[i]}});
  const signalMap={
    'SGE Gold (¥/g)':gprices,
    'USD Index':usdOnLabels,
    'US CPI YoY (%)':cpiOnLabels,
    'Real 10Y Yield (%)':realOnLabels,
    'GPR':gprOnLabels,
    'BTC/USD':btcOnLabels,
    'AUX/USD':auxOnLabels,
    'XAG/USD':xagOnLabels,
    'CB Demand (tonnes)':cbOnLabels,
    'Fed Funds Rate (%)':fedOnLabels,
    'NASDAQ':nasdaqOnLabels,
    'Au99.99 (¥/g)':au9999OnLabels,
    'Tencent (0700.HK)':tencentOnLabels,
    'USD/CNY':usdCnyOnLabels,
    'CAC 40':cac40OnLabels,
    'DAX':daxOnLabels,
    'S&P 500':sp500OnLabels,
    'Nikkei 225':nikkeiOnLabels,
    'Shanghai':shanghaiOnLabels,
    'KOSPI':kospiOnLabels,
    'AUX/XAG':auxXagOnLabels,
    'BTC/XAU':btcXauOnLabels,
  };

  const cors=[
    ['USD Index',M,'usd_close'],
    ['US CPI YoY',M,'cpi_yoy_pct'],
    ['Real 10Y Yield',M,'real_yield_pct'],
    ['GPR',M,'gpr'],
    ['BTC/USD',M,'btc_usd'],
    ['AUX/USD',M,'aux_usd'],
    ['XAG/USD',M,'xag_usd'],
    ['AUX/XAG',auxXagByMonth,'v'],
    ['BTC/XAU',btcXauByMonth,'v'],
    ['CB Demand',M,'cb_demand'],
    ['Fed Rate',M,'fed_rate_pct'],
    ['NASDAQ',M,'nasdaq_close'],
    ['USD/CNY',M,'usd_cny'],
    ['Au99.99',M,'au9999_close'],
    ['Tencent (0700.HK)',M,'tencent_close'],
    ['CAC 40',M,'cac40_close'],
    ['DAX',M,'dax_close'],
    ['S&P 500',M,'sp500_close'],
    ['Nikkei 225',M,'nikkei_close'],
    ['Shanghai',M,'shanghai_close'],
    ['KOSPI',M,'kospi_close'],
  ].map(([name,map,key])=>{
    const {r,lag}=bestLagCorr(map,key);
    const dir=lag>0?'leads':lag<0?'lags':'sync';
    return {name,r,lag,dir};
  }).sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));

  const explain={
    'USD Index':'Gold is USD-priced — a stronger dollar makes it costlier abroad, damping demand (inverse channel).',
    'US CPI YoY':'Gold is the classic inflation hedge; rising CPI erodes real returns and lifts gold demand.',
    'Real 10Y Yield':'Gold pays no yield — higher real yields raise its opportunity cost (inverse).',
    'GPR':'Geopolitical risk spikes trigger safe-haven gold buying.',
    'BTC/USD':'Crypto trades as risk-on "digital gold"; capital often shifts between BTC and gold, so they co-move.',
    'AUX/USD':'Shanghai-exchange gold — the same asset priced in CNY/USD; tracks gold near 1:1.',
    'XAG/USD':'Silver (industrial + precious) usually turns before gold; the pair co-moves, silver often leads.',
    'AUX/XAG':'Gold/silver ratio — high when gold outperforms silver in risk-off episodes; mean-reverting, rises with gold.',
    'BTC/XAU':'Crypto risk appetite relative to gold — falls when safe-haven demand lifts gold above BTC.',
    'CB Demand':'Central-bank purchases are a structural demand driver that supports gold prices.',
    'Fed Rate':'Higher policy rates raise gold\u2019s opportunity cost and strengthen the dollar (inverse).',
    'NASDAQ':'Equities vs gold flip between risk-on (both up) and risk-off (gold up, stocks down) regimes — net link weak.',
    'USD/CNY':'A weaker CNY lifts local-currency gold demand on the Shanghai exchange.',
    'Au99.99':'Shanghai spot gold — same asset as AUX; tracks near 1:1.',
    'Tencent (0700.HK)':'China tech bellwether — signals China liquidity and risk appetite that also flow into gold demand.',
    'CAC 40':'European equities transmit EUR/USD swings (which move the dollar index) and risk sentiment to gold.',
    'DAX':'Same EUR/USD and risk channels as CAC; German yield sensitivity mirrors gold\u2019s real-rate driver.',
    'S&P 500':'Global risk appetite and the real-rate regime — negative when Fed tightening lifts real yields, positive in easing.',
    'Nikkei 225':'Japan\u2019s ultra-low rates and yen carry make gold vs Nikkei a risk-on/off switch.',
    'Shanghai':'China A-shares: PBOC easing lifts both domestic equities and gold demand via the liquidity channel.',
    'KOSPI':'Korea equities transmit USD/KRW moves and global risk-on/off; diverges from gold in risk-off episodes.',
  };

  const dirTxt=d=>d==='leads'?'leads gold':d==='lags'?'gold leads':'synchronous';
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function flowSvg(cors){
    const W=980,H=840,CX=490,CY=445;
    const R_IN=250,R_OUT=335,N=cors.length;
    const boxW=118,boxH=44;
    const gW=150,gH=58,hw=gW/2,hh=gH/2;
    const shortName={'Tencent (0700.HK)':'Tencent'};
    const col=r=>Math.abs(r)<0.2?'#9ca3af':r>0?'#22c55e':'#ef4444';
    function rayBox(fx,fy,ux,uy,cx,cy,w,h){
      const t1=(cx-w/2-fx)/ux,t2=(cx+w/2-fx)/ux;
      const t3=(cy-h/2-fy)/uy,t4=(cy+h/2-fy)/uy;
      const tmin=Math.max(Math.min(t1,t2),Math.min(t3,t4));
      const tmax=Math.min(Math.max(t1,t2),Math.max(t3,t4));
      const t=(tmin>0?tmin:tmax)||0;
      return [fx+ux*t,fy+uy*t];
    }
    const edges=[],nodes=[];
    cors.forEach((c,i)=>{
      const a=-Math.PI/2+(i*2*Math.PI)/N;
      const R=i%2===0?R_IN:R_OUT;
      const x=CX+Math.cos(a)*R,y=CY+Math.sin(a)*R;
      const dx=CX-x,dy=CY-y;
      const L=Math.hypot(dx,dy)||1;
      const ux=dx/L,uy=dy/L;
      const ccol=col(c.r);
      const lw=(1+Math.abs(c.r)*3.2).toFixed(1);
      const dash=Math.abs(c.r)<0.2?'4 3':'';
      const rel=(c.r>=0?'+':'')+c.r.toFixed(3);
      const lead=Math.abs(c.lag);
      const stats=c.dir==='sync'?'synchronous with gold':`${dirTxt(c.dir)} (${lead} mo)`;
      const leadTxt=c.dir==='leads'?`${c.name} leads gold (${lead} mo)`:c.dir==='lags'?`gold leads ${c.name} (${lead} mo)`:`${c.name} is synchronous with gold`;
      const reason=explain[c.name]?' — '+explain[c.name]:'';
      if(c.dir==='lags'){
        const [ex,ey]=rayBox(CX,CY,-ux,-uy,x,y,boxW,boxH);
        edges.push(`<line x1="${CX.toFixed(1)}" y1="${CY.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${ccol}" stroke-width="${lw}"${dash?` stroke-dasharray="${dash}"`:''} marker-end="url(#flowArrow)"><title>${esc(leadTxt)}: r=${rel}, ${rLabel(c.r)} correlation${reason}</title></line>`);
      }else if(c.dir==='sync'){
        const [nx,ny]=rayBox(x,y,ux,uy,x,y,boxW,boxH);
        const [gx,gy]=rayBox(x,y,ux,uy,CX,CY,gW,gH);
        edges.push(`<line x1="${nx.toFixed(1)}" y1="${ny.toFixed(1)}" x2="${gx.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="${ccol}" stroke-width="${lw}"${dash?` stroke-dasharray="${dash}"`:''} marker-start="url(#flowArrow)" marker-end="url(#flowArrow)"><title>${esc(leadTxt)}: r=${rel}, ${rLabel(c.r)} correlation${reason}</title></line>`);
      }else{
        const [ex,ey]=rayBox(x,y,ux,uy,CX,CY,gW,gH);
        edges.push(`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${ccol}" stroke-width="${lw}"${dash?` stroke-dasharray="${dash}"`:''} marker-end="url(#flowArrow)"><title>${esc(leadTxt)}: r=${rel}, ${rLabel(c.r)} correlation${reason}</title></line>`);
      }
      const nm=shortName[c.name]||c.name;
      const label=nm.length>18?nm.slice(0,17)+'…':nm;
      const vcol=c.r>=0.2?'#16a34a':c.r<=-0.2?'#dc2626':'#6b7280';
      nodes.push(`<g><title>${esc(c.name)}: r=${rel}, ${stats}, ${rLabel(c.r)} correlation with gold${reason}</title>
        <rect x="${(x-boxW/2).toFixed(1)}" y="${(y-boxH/2).toFixed(1)}" width="${boxW}" height="${boxH}" rx="8" fill="#fff" stroke="${ccol}" stroke-width="1.5"/>
        <text x="${x.toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="#1a1a2e">${esc(label)}</text>
        <text x="${x.toFixed(1)}" y="${(y+10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${vcol}">${c.r>=0?'+':''}${c.r.toFixed(2)}</text></g>`);
    });
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Gold lead-lag causality flowchart">
      <defs><marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
      ${edges.join('')}
      <g><title>SGE Gold (¥/g) — reference series</title>
        <rect x="${CX-hw}" y="${CY-hh}" width="${gW}" height="${gH}" rx="10" fill="#f59e0b"/>
        <text x="${CX}" y="${CY-1}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">SGE Gold (¥/g)</text>
        <text x="${CX}" y="${CY+13}" text-anchor="middle" font-size="9.5" fill="#fff" opacity=".9">reference series</text></g>
      ${nodes.join('')}
    </svg>`;
  }

  document.getElementById('app').innerHTML=`
    <div class="chart-card">
      <h2>Gold &amp; Macro Index</h2>
      <div class="chart-controls">
        <div class="range-group">
          <label>Range:</label>
          <span class="range-label" id="rangeStartLabel"></span>
          <div class="dual-range" id="dualRange">
            <div class="dr-track"></div>
            <div class="dr-fill" id="rangeFill"></div>
            <input type="range" id="rangeStart" min="0" max="1" value="0" step="1">
            <input type="range" id="rangeEnd" min="0" max="1" value="1" step="1">
          </div>
          <span class="range-label" id="rangeEndLabel"></span>
        </div>
        <select id="corrS1" style="font-size:10px;padding:2px 4px;border:1px solid #d1d5db;border-radius:4px;max-width:110px"><option value="">— line —</option>${Object.keys(signalMap).map((s,i)=>`<option value="${s}"${i===0?' selected':''}>${s}</option>`).join('')}</select>
        <select id="corrS2" style="font-size:10px;padding:2px 4px;border:1px solid #d1d5db;border-radius:4px;max-width:110px"><option value="">— line —</option>${Object.keys(signalMap).map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
      </div>
      <div class="chart-wrapper"><canvas id="priceChart"></canvas></div>
    </div>

    <div class="chart-card" style="margin-top:8px">
      <h2>Gold Lead-Lag Causality Flowchart</h2>
      <div style="overflow-x:auto">${flowSvg(cors)}</div>
      <div class="flow-legend">
        <span class="lg"><span class="lg-line" style="background:#22c55e"></span>Positive</span>
        <span class="lg"><span class="lg-line" style="background:#ef4444"></span>Negative</span>
        <span class="lg"><span class="lg-line" style="background:#9ca3af"></span>Weak / none</span>
        <span class="lg">Thickness = strength |r|</span>
        <span class="lg">Arrow = leading series (leader &rarr; laggard)</span>
      </div>
      <div class="flow-cap">Best-lag lead-lag causality with SGE Gold (¥/g) over its full history: the arrow points from the leading series toward the lagging one (double-headed = synchronous). Thickness = |r|, color = sign of correlation. Hover a node or edge for r, lead and economic rationale.</div>
      <details class="flow-rationale">
        <summary>Economic Rationale (${cors.length})</summary>
        <div class="wrap"><table>
          <thead><tr><th>Series</th><th>Direction</th><th>r (lead)</th><th>Rationale</th></tr></thead>
          <tbody>${cors.map(c=>`<tr>
            <td><strong>${c.name}</strong></td>
            <td class="dir">${c.dir==='leads'?'<span class="up">leads gold</span>':c.dir==='lags'?'<span class="down">gold leads</span>':'<span>synchronous</span>'}</td>
            <td>${c.r.toFixed(3)} (${c.lag>0?'+':''}${c.lag} mo)</td>
